<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore our collection of durable jackets for your next adventure." />
    <title>Rainy Days | Products</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container nav-bar">
        <a href="index.html" class="logo">
          <img src="images/RainyDays_Logo.png" alt="Rainy Days logo" />
        </a>
        <nav aria-label="Primary" class="main-nav">
          <ul class="nav-list">
            <li><a href="products.html">Men</a></li>
            <li><a href="products.html">Women</a></li>
            <li><a href="coming-soon.html">Activities</a></li>
            <li><a href="coming-soon.html">About</a></li>
            <li><a href="coming-soon.html">Contact</a></li>
          </ul>
        </nav>

        <div class="nav-icons">
          <a href="#"><img src="images/Icons/Vector-(Stroke).svg" alt="Search" /></a>
          <a href="cart.html" class="cart-link" aria-label="Shopping cart">
            <img src="images/Icons/Union.svg" alt="Shopping cart" />
            <span id="cartCount" class="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <h1 class="section-title">All Products</h1>
        </div>
      </section>

      <section class="featured section">
        <div class="container">
          <div class="filters">
            <select id="genderFilter">
              <option value="">All Genders</option>
            </select>

            <select id="tagFilter">
              <option value="">All Tags</option>
            </select>

            <input id="searchFilter" type="search" placeholder="Search product..." />

            <button id="clearFilter" type="button">Clear</button>
          </div>

          <div id="productGrid" class="cards-grid cards-3"></div>

          <p id="productMessage" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <div class="footer-links">
          <a href="coming-soon.html">About</a>
          <a href="coming-soon.html">Contact</a>
          <a href="coming-soon.html">FAQ</a>
          <a href="coming-soon.html">Shipping</a>
        </div>
        <p class="copyright">© 2025 Rainy Days</p>
      </div>
    </footer>

    <script type="module" src="js/products.mjs"></script>
  </body>
</html>
