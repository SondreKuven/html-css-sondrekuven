<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View and manage the items in your shopping cart." />
    <title>Rainy Days | Cart</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container nav-bar">
        <a href="index.html" class="logo">
          <img src="images/RainyDays_Logo.png" alt="Rainy Days logo" />
        </a>
        <nav aria-label="Primary" class="main-nav">
          <ul class="nav-list">
            <li><a href="products.html">Men</a></li>
            <li><a href="products.html">Women</a></li>
            <li><a href="coming-soon.html">Activities</a></li>
            <li><a href="coming-soon.html">About</a></li>
            <li><a href="coming-soon.html">Contact</a></li>
          </ul>
        </nav>

        <div class="nav-icons">
          <a href="#"><img src="images/Icons/Vector-(Stroke).svg" alt="Search" /></a>
          <a href="cart.html" class="cart-link" aria-label="Shopping cart">
            <img src="images/Icons/Union.svg" alt="Shopping cart" />
            <span id="cartCount" class="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <main>
      <section class="cart-section">
        <div class="container cart-wrapper">
          <h1>Your Cart</h1>

          <div id="cartItems"></div>
          <p class="subtotal"><strong>Subtotal:</strong><span id="cartSubtotal">0</span></p>
          <p id="cartMessage" role="status" aria-live="polite"></p>

          <a href="checkout/index.html" class="btn btn-primary">Checkout</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <div class="footer-links">
          <a href="coming-soon.html">About</a>
          <a href="coming-soon.html">Contact</a>
          <a href="coming-soon.html">FAQ</a>
          <a href="coming-soon.html">Shipping</a>
        </div>
        <p class="copyright">© 2025 Rainy Days</p>
      </div>
    </footer>

    <script type="module" src="js/cart.mjs"></script>
  </body>
</html>
